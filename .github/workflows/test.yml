name: "Tests"

on:
  pull_request:
  push:
    branches:
      - "*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm run dev:prepare

      - name: Typecheck
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm run dev:prepare

      - name: Test
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm run dev:prepare

      - name: Build
        run: pnpm run build
